<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0C0D" />
    <meta name="description" content="LedgerLite — Private wealth & personal finance manager with local-first security and intelligence." />
    
    <!-- Google Fonts: Inter (UI), Instrument Serif (display), JetBrains Mono (data labels) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    
    <title>LedgerLite — Private Wealth & Expense Manager</title>
  </head>
  <body class="antialiased min-h-screen">
    <!-- Liquid-glass refraction: edge-weighted displacement applied to the backdrop (Chromium) -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <filter id="lg-refract" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feImage href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='200'%20height='200'%20viewBox='0%200%20200%20200'%20preserveAspectRatio='none'%3E%3Cdefs%3E%3ClinearGradient%20id='x'%20x1='0'%20x2='1'%20y1='0'%20y2='0'%3E%3Cstop%20offset='0'%20stop-color='rgb(0,0,0)'/%3E%3Cstop%20offset='.14'%20stop-color='rgb(128,0,0)'/%3E%3Cstop%20offset='.86'%20stop-color='rgb(128,0,0)'/%3E%3Cstop%20offset='1'%20stop-color='rgb(255,0,0)'/%3E%3C/linearGradient%3E%3ClinearGradient%20id='y'%20x1='0'%20x2='0'%20y1='0'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='rgb(0,0,0)'/%3E%3Cstop%20offset='.22'%20stop-color='rgb(0,128,0)'/%3E%3Cstop%20offset='.78'%20stop-color='rgb(0,128,0)'/%3E%3Cstop%20offset='1'%20stop-color='rgb(0,255,0)'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width='200'%20height='200'%20fill='url(%23x)'/%3E%3Crect%20width='200'%20height='200'%20fill='url(%23y)'%20style='mix-blend-mode:screen'/%3E%3C/svg%3E" x="0" y="0" width="100%" height="100%" preserveAspectRatio="none" result="map" />
        <feDisplacementMap in="SourceGraphic" in2="map" scale="26" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
