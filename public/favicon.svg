<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E6B94" />
      <stop offset="50%" stop-color="#16587B" />
      <stop offset="100%" stop-color="#0B2A3D" />
    </linearGradient>
    <linearGradient id="creamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F5EEDD" />
      <stop offset="100%" stop-color="#E5DCBF" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8DCF0" />
      <stop offset="100%" stop-color="#84B3CE" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#05141E" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#F5EEDD" stroke-width="3" stroke-opacity="0.18" />

  <!-- Central Emblem Container -->
  <g filter="url(#shadow)">
    <!-- Shield / Vault Outline Accent -->
    <path d="M 256 92 L 382 144 C 382 254 328 348 256 392 C 184 348 130 254 130 144 Z" fill="none" stroke="url(#skyGrad)" stroke-width="4" stroke-opacity="0.35" stroke-dasharray="6 6" />

    <!-- Stylized Modern Serif 'L' Monogram -->
    <!-- Vertical stem with serif top -->
    <path d="
      M 188 152
      L 248 152
      L 248 316
      L 336 316
      C 344 316 350 322 350 330
      L 350 354
      C 350 360 344 366 336 366
      L 188 366
      C 180 366 174 360 174 352
      L 174 166
      C 174 158 180 152 188 152
      Z
    " fill="url(#creamGrad)" />

    <!-- Serif Head on L stem -->
    <path d="
      M 166 156
      C 166 150 171 146 177 146
      L 259 146
      C 265 146 270 150 270 156
      L 270 166
      C 270 170 266 174 262 174
      L 248 174
      L 188 174
      L 174 174
      C 170 174 166 170 166 166
      Z
    " fill="url(#creamGrad)" />

    <!-- Diamond Star Accent at upper right -->
    <path d="M 326 182 L 340 156 L 366 142 L 340 128 L 326 102 L 312 128 L 286 142 L 312 156 Z" fill="url(#skyGrad)" />
    <!-- Secondary small diamond accent -->
    <circle cx="326" cy="142" r="5" fill="#FFFFFF" />

    <!-- Horizontal Ledger Balance Bars -->
    <rect x="256" y="228" width="68" height="6" rx="3" fill="url(#skyGrad)" fill-opacity="0.75" />
    <rect x="256" y="254" width="48" height="6" rx="3" fill="url(#skyGrad)" fill-opacity="0.5" />
    <rect x="256" y="280" width="82" height="6" rx="3" fill="url(#skyGrad)" fill-opacity="0.85" />
  </g>
</svg>
